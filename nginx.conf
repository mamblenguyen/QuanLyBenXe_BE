server {
    listen 80;
    server_name localhost;

    root /var/www/public;  # Đảm bảo rằng thư mục gốc là /var/www/public nếu bạn đang sử dụng Laravel

    index index.php index.html index.htm;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;  # Đảm bảo đường dẫn chính xác với PHP-FPM
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }
}
