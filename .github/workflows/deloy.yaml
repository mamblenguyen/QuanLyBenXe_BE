name: Deploy Laravel to EC2

on:
  push:
    branches: [production]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.5.4
      with:
        ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

    - name: Copy code to EC2
      run: |
        rsync -avz --exclude=".git" --exclude="vendor" -e "ssh -o StrictHostKeyChecking=no" ./ ec2-user@13.228.62.0:/home/ec2-user/laravel-api

    - name: Run Docker Compose on EC2
      run: |
        ssh -o StrictHostKeyChecking=no ec2-user@13.228.62.0 << 'EOF'
          cd /home/ec2-user/laravel-api
          docker-compose down
          docker-compose up -d --build
        EOF
