name: Deploy FE to EC2

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/react-fe .
          docker push ${{ secrets.DOCKER_USERNAME }}/react-fe

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            docker stop react-fe || true
            docker rm react-fe || true
            docker rmi ${{ secrets.DOCKER_USERNAME }}/react-fe || true
            docker pull ${{ secrets.DOCKER_USERNAME }}/react-fe
            docker run -d -p 80:80 --name react-fe ${{ secrets.DOCKER_USERNAME }}/react-fe
