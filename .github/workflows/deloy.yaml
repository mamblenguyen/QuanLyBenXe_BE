name: Deploy to EC2

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ubuntu/QuanLyBenXe_BE
            git reset --hard
            git pull origin production
            sudo docker-compose down
            sudo docker-compose up -d --build
            sudo docker exec laravel_app composer install --no-interaction --prefer-dist --optimize-autoloader
            sudo docker exec laravel_app php artisan key:generate
            sudo docker exec laravel_app php artisan config:clear
            sudo docker exec laravel_app php artisan migrate --force
            sudo docker exec laravel_app chmod -R 777 storage bootstrap/cache





