[phases.setup]
nixPkgs = ["php", "composer", "mysql", "nodejs", "yarn"]

[phases.build]
cmds = [
  "composer install --no-dev --optimize-autoloader",
  "php artisan key:generate",
  "php artisan migrate --force",
  "php artisan vietnamzone:import",
  "php artisan db:seed --force",  # Thêm lệnh này để seed dữ liệu
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache"
]

[start]
cmd = "php -S 0.0.0.0:8080 -t public"  # Sử dụng PHP built-in server cho Laravel
