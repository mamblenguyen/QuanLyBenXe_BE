services:
  - type: web  # This sets the service type as a web service
    name: QuanLyBenXe_BE
    runtime: docker  # Use Docker to run PHP
    buildCommand: |
      composer install --no-dev --optimize-autoloader
    startCommand: |
      php artisan serve --host=0.0.0.0 --port=80
    envVars:
      - key: APP_KEY
        value: YOUR_APP_KEY
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: YOUR_DATABASE_HOST
      - key: DB_PORT
        value: 3306
      - key: DB_DATABASE
        value: YOUR_DATABASE_NAME
      - key: DB_USERNAME
        value: YOUR_DATABASE_USERNAME
      - key: DB_PASSWORD
        value: YOUR_DATABASE_PASSWORD
    plan: free
    branch: master
