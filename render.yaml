services:
  - type: web  # This sets the service type as a web service
    name: QuanLyBenXe_BE
    runtime: docker  # Use Docker to run PHP
    buildCommand: |
      composer install --no-dev --optimize-autoloader
    startCommand: |
      php artisan serve --host=0.0.0.0 --port=80
    envVars:
      - key: APP_KEY
        value: base64:ygU3pFZjC8oL/GBiOvAUFHzf958k8Zf31q4K8tArcv0=
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: localhost
      - key: DB_PORT
        value: 3306
      - key: DB_DATABASE
        value: route_management
      - key: DB_USERNAME
        value: root
      - key: DB_PASSWORD
        value: mysql
    plan: free
    branch: main
